<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5e6ec">
<title>🌸 シフト管理</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#f8f9fa;font-family:-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:14px;color:#1e293b;overscroll-behavior:none}
input,button,select,textarea{font-family:inherit;font-size:14px;-webkit-appearance:none;appearance:none}
button{border:none;cursor:pointer;background:transparent}
button:active{opacity:0.75;transform:scale(0.98)}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
#loading{position:fixed;inset:0;background:#f8f9fa;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.sp{width:32px;height:32px;border:2.5px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:spin 0.7s linear infinite}
#setup{position:fixed;inset:0;background:#f8f9fa;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:9998;overflow-y:auto}
#setup.show{display:flex}
</style>
</head>
<body>

<div id="loading">
  <div style="font-size:13px;font-weight:700;color:#4f46e5;letter-spacing:0.08em">SHIFT</div>
  <div class="sp" style="margin-top:4px"></div>
  <div style="font-size:12px;color:#94a3b8;letter-spacing:0.04em" id="loading-msg">起動中...</div>
</div>

<div id="setup">
  <div style="max-width:460px;width:100%">
    <div style="font-size:22px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:4px;letter-spacing:-0.02em">SHIFT</div>
    <div style="font-size:13px;color:#94a3b8;text-align:center;margin-bottom:24px">GASのURLを設定してください</div>

    <div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 24px rgba(79,70,229,0.08);border:1px solid #e2e8f0">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px">GASウェブアプリURL</div>
      <textarea id="urlInput" rows="3"
        placeholder="https://script.google.com/macros/s/xxxxx/exec"
        style="width:100%;border:1.5px solid #eacdd6;border-radius:10px;padding:10px 12px;font-size:13px;color:#3d1f2a;resize:none;line-height:1.5;outline:none"></textarea>
      <div style="font-size:11px;color:#c4a0b0;margin-top:6px;margin-bottom:16px">GASをデプロイして発行されたURLを貼り付けてください</div>
      <div id="setupError" style="color:#9b2335;font-size:12px;margin-bottom:10px;display:none"></div>
      <button id="connectBtn" onclick="connectGAS()"
        style="width:100%;background:#4f46e5;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600">
        接続する
      </button>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid #eacdd6">
        <div style="font-size:11px;font-weight:700;color:#8a6070;margin-bottom:8px">GASセットアップ手順</div>
        <ol style="font-size:11px;color:#8a6070;padding-left:16px;line-height:2.0">
          <li>Googleスプレッドシートを新規作成</li>
          <li>「拡張機能」→「Apps Script」を開く</li>
          <li>Code.gs の内容を貼り付けて保存</li>
          <li>「デプロイ」→「新しいデプロイ」→ウェブアプリ</li>
          <li>アクセス「全員」→「デプロイ」</li>
          <li>表示されたURLを上に貼り付けて接続</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<div id="app" style="display:none"></div>

<script>
// ============================================================
// ★ GAS URLの設定（接続後に自動保存されます）
// ============================================================
const LS_URL  = 'shift_gas_url_v2';
const LS_DATA = 'shift_data_v7';
const LS_MEM  = 'shift_members_v7';

// ★ GASウェブアプリURL（埋め込み済み）
const PRESET_GAS_URL = 'https://script.google.com/macros/s/AKfycbzjhujE1cfG7JwZJMfdo6b7_rJTbu9ntfGdTv7-l-KcqFKxNgZVJji7_Xj8_nlRbU6-BA/exec';
let GAS_URL = localStorage.getItem(LS_URL) || PRESET_GAS_URL;

// ============================================================
// CONSTANTS
// ============================================================
const DEFAULT_MEMBERS=[
  {id:1,name:'苅間澤',category:'main',color:'#4f46e5'},
  {id:2,name:'糟谷',  category:'main',color:'#db2777'},
  {id:3,name:'梶賀',  category:'main',color:'#059669'},
  {id:4,name:'庄子',  category:'main',color:'#d97706'},
  {id:5,name:'蛮治',  category:'main',color:'#dc2626'},
  {id:6,name:'庄司',  category:'main',color:'#7c3aed'},
  {id:7,name:'及川',  category:'sub'},
  {id:8,name:'大久保',category:'sub'},
  {id:9,name:'川村',  category:'sub'},
  {id:10,name:'山田', category:'sub'},
];
const STATUS_LIST=['事務所番','金庫番','掃除','夜間現場','公休','有休','午前半休','午後半休'];
const STATUS_DEFAULT=['公休','有休','午前半休','午後半休','現場'];
const STATUS_OTHER=['事務所番','金庫番','掃除','夜間現場'];
const DUTY_STATUS_MAP={'__office__':'事務所番','__safe__':'金庫番','__clean__':'掃除'};
const DUTY_LABELS=Object.values(DUTY_STATUS_MAP); // ['事務所番','金庫番','掃除']
const STATUS_STYLE={
  '事務所番':{bg:'#fdf2f8',text:'#db2777',border:'#fbcfe8'},
  '金庫番'  :{bg:'#fffbeb',text:'#d97706',border:'#fde68a'},
  '掃除'    :{bg:'#ecfdf5',text:'#059669',border:'#a7f3d0'},
  '現場'    :{bg:'#fefce8',text:'#ca8a04',border:'#fef08a'},
  '夜間現場':{bg:'#fefce8',text:'#ca8a04',border:'#fef08a'},
  '公休'    :{bg:'#fef2f2',text:'#dc2626',border:'#fca5a5'},
  '有休'    :{bg:'#fff7ed',text:'#ea580c',border:'#fed7aa'},
  '午前半休':{bg:'#f5f3ff',text:'#7c3aed',border:'#ddd6fe'},
  '午後半休':{bg:'#eff6ff',text:'#2563eb',border:'#bfdbfe'},
};
const DUTY_COLS=[
  {key:'__office__',label:'事務所番',accent:'#db2777',lightBg:'#fdf2f8',tag:'#ec4899',req:true},
  {key:'__safe__',  label:'金庫番',  accent:'#d97706',lightBg:'#fffbeb',tag:'#f59e0b',req:false},
  {key:'__clean__', label:'掃除',    accent:'#059669',lightBg:'#ecfdf5',tag:'#10b981',req:false},
];
// メンバーカラーパレット（12色）
const MEMBER_COLORS=[
  '#4f46e5','#db2777','#059669','#d97706',
  '#dc2626','#7c3aed','#0891b2','#ea580c',
  '#0284c7','#9333ea','#16a34a','#65a30d',
];
// デフォルトメンバーに色を割り当て
const HOLIDAYS=['2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24','2025-03-20',
  '2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06','2025-07-21',
  '2025-08-11','2025-09-15','2025-09-23','2025-10-13','2025-11-03','2025-11-23',
  '2025-11-24','2025-12-23','2026-01-01','2026-01-12','2026-02-11','2026-02-23',
  '2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06'];
const C={
  bg:'#f8f9fa',bgAlt:'#f1f5f9',hBg:'#ffffff',hBorder:'#e2e8f0',
  accent:'#4f46e5',aLight:'#eef2ff',aDark:'#3730a3',
  wkBg:'#f8fafc',sun:'#ef4444',sat:'#6366f1',
  text:'#1e293b',sub:'#64748b',muted:'#94a3b8',
  border:'#e2e8f0',strong:'#cbd5e1',
  warnBg:'#fef2f2',warnBorder:'#fca5a5',warnText:'#dc2626',
  mainCat:'#4f46e5',subCat:'#0891b2',
  mainBg:'#eef2ff',subBg:'#ecfeff',
  mainBorder:'#c7d2fe',subBorder:'#a5f3fc',
};

// ============================================================
// DATE UTILS
// ============================================================
function getMonthDays(y,m){const days=[];for(let d=new Date(y,m-1,21);d<=new Date(y,m,20);d.setDate(d.getDate()+1))days.push(new Date(d));return days;}
// 21日始まりの業務月ラベルを算出する（例：8/13→7月期間＝7/21〜8/20、8/25→8月期間＝8/21〜9/20）
function getPeriodYM(d){let y=d.getFullYear(),m=d.getMonth()+1;if(d.getDate()<21){m--;if(m<1){m=12;y--;}}return{year:y,month:m};}
function toDS(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isHol(d){return HOLIDAYS.includes(toDS(d));}
function isWk(d){const w=d.getDay();return w===0||w===6;}
function isReq(d){return isWk(d)||isHol(d);}
function dayLbl(d){return['日','月','火','水','木','金','土'][d.getDay()];}
function dayClr(d){if(d.getDay()===0||isHol(d))return C.sun;if(d.getDay()===6)return C.sat;return C.text;}
const TODAY_DS=toDS(new Date());

// ============================================================
// GAS API通信
// ============================================================
const GAS_LOAD_TIMEOUT=12000; // 12秒応答が無ければタイムアウト
const GAS_SAVE_TIMEOUT=15000; // 15秒応答が無ければタイムアウト

// fetchにタイムアウトを付与する（GASのコールドスタート等で応答が固まった場合に
// 「データを読み込み中...」から無限に戻ってこなくなるのを防ぐ）
function fetchWithTimeout(url,opts,timeoutMs){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
  return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(timer));
}

async function gasLoad(){
  try{
    const res=await fetchWithTimeout(GAS_URL+'?action=load',{redirect:'follow'},GAS_LOAD_TIMEOUT);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.ok)throw new Error(data.error||'load failed');
    return data;
  }catch(e){
    const msg=e.name==='AbortError'?'応答がありません（タイムアウト）':e.message;
    throw new Error('読み込み失敗: '+msg);
  }
}

async function gasSave(shiftData,members){
  // no-corsモードでPOST（iOS Safariのリダイレクト/CORSエラー回避）
  // レスポンスは読めないがデータは確実に送信される
  try{
    const body=new URLSearchParams({
      action:'save',
      shift:JSON.stringify(shiftData),
      members:JSON.stringify(members),
    });
    await fetchWithTimeout(GAS_URL,{
      method:'POST',
      body:body.toString(),
      mode:'no-cors', // CORS/リダイレクト問題を回避
    },GAS_SAVE_TIMEOUT);
    // no-corsではレスポンスを読めないので成功とみなす
    return{ok:true};
  }catch(e){
    const msg=e.name==='AbortError'?'応答がありません（タイムアウト）':e.message;
    throw new Error('保存失敗: '+msg);
  }
}

// 接続テスト＆URL保存
async function connectGAS(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url)return;
  const btn=document.getElementById('connectBtn');
  const err=document.getElementById('setupError');
  btn.textContent='接続中...';btn.disabled=true;err.style.display='none';
  try{
    GAS_URL=url;
    const data=await gasLoad();
    localStorage.setItem(LS_URL,url);
    initApp(data);
  }catch(e){
    err.textContent='⚠ 接続失敗: URLを確認してください。\n('+e.message+')';
    err.style.display='block';
    btn.textContent='接続する';btn.disabled=false;
  }
}

// ============================================================
// 保存レイヤー（デバウンス）
// ============================================================
let saveTimer=null;
const SAVE_DELAY=800;
let isSaving=false;   // gasSave実行中フラグ（保存の直列化用）
let saveQueued=false; // 実行中に来た追加の保存要求

function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,SAVE_DELAY);}

async function flushSave(){
  // 保存中に新しい保存要求が来た場合はキューに積むだけにして、
  // 現在の保存が終わってから最新state で再実行する（並行fetchによる上書き競合を防止）
  if(isSaving){saveQueued=true;return;}
  isSaving=true;
  try{
    setSaveStatus('saving');
    // クラウド接続の有無・成否にかかわらず、まずローカルに保存する。
    // これによりGAS保存が失敗（オフライン／URL失効／GAS側エラー）しても
    // 端末上のデータは必ず残り、消失しない。
    localStorage.setItem(LS_DATA,JSON.stringify(state.data));
    localStorage.setItem(LS_MEM,JSON.stringify(state.members));
    if(GAS_URL){
      await gasSave(state.data,state.members);
    }
    setSaveStatus('saved');
  }catch(e){
    // ここに来るのはgasSave（ネットワーク層）の失敗のみ。
    // ローカル保存は上で完了済みなのでデータは失われていない。
    setSaveStatus('error');
    console.error('クラウド保存エラー（端末には保存済み）:',e);
  }finally{
    isSaving=false;
    if(saveQueued){
      saveQueued=false;
      flushSave(); // 保留中の保存要求を最新stateで実行
    }
  }
}

function setSaveStatus(s){
  const ind=document.getElementById('save-indicator');
  if(!ind)return;
  clearTimeout(window._sit);
  if(s==='saving'){
    ind.textContent='保存中...';
    ind.style.background='#64748b';
    ind.style.opacity='1';ind.style.transform='translateY(0)';
  }else if(s==='saved'){
    ind.textContent=GAS_URL?'クラウドに保存しました':'ローカルに保存しました';
    ind.style.background='#1e293b';
    ind.style.opacity='1';ind.style.transform='translateY(0)';
    window._sit=setTimeout(()=>{ind.style.opacity='0';ind.style.transform='translateY(-8px)';},2000);
  }else{
    ind.textContent=GAS_URL?'クラウド保存失敗（端末には保存済み）':'保存失敗';
    ind.style.background='#dc2626';
    ind.style.opacity='1';ind.style.transform='translateY(0)';
    window._sit=setTimeout(()=>{ind.style.opacity='0';ind.style.transform='translateY(-8px)';},3500);
  }
}

// ============================================================
// STATE
// ============================================================
const today=new Date();
const initPeriod=getPeriodYM(today); // 21日始まりの業務月に合わせた初期表示期間
let state={
  year:initPeriod.year,month:initPeriod.month,
  data:{},members:DEFAULT_MEMBERS,
  editMode:'view',showMembers:false,showSettings:false,activeAction:'view',swapMode:false,swapDayA:null,swapDayB:null,showResetModal:false,
  tab:'shift',modal:null,
  assignOpts:{pair:false,consec:false,noConsec:false},
  showAssign:false,copied:false,nextId:11,bottomPanel:null,showBalancePanel:false,
};
let longPressTimer=null,rerenderScheduled=false,memberSaveTimer=null;
let lastRenderedMonth=''; // 月切替検知用

function setState(patch,save){
  Object.assign(state,typeof patch==='function'?patch(state):patch);
  if(save)scheduleSave();
  if(!rerenderScheduled){rerenderScheduled=true;requestAnimationFrame(()=>{rerenderScheduled=false;render();});}
}
function updateMemberName(id,newName){
  state.members=state.members.map(x=>x.id===id?{...x,name:newName}:x);
  clearTimeout(memberSaveTimer);memberSaveTimer=setTimeout(()=>scheduleSave(),400);
}

// ============================================================
// HELPERS
// ============================================================
// メンバーカラーを取得（デフォルト: サブカテゴリーはグレー）
function getMemberColor(name){
  const m=state.members.find(x=>x.name===name);
  return m?.color||(m?.category==='main'?MEMBER_COLORS[0]:'#94a3b8');
}

// initApp でメンバーに色がない場合は自動付与
function ensureMemberColors(members){
  let colorIdx=0;
  return members.map(m=>{
    if(m.category==='main'&&!m.color){
      const c=MEMBER_COLORS[colorIdx%MEMBER_COLORS.length];
      colorIdx++;
      return{...m,color:c};
    }
    return m;
  });
}

function syncDutyToMembers(dd,key,names,all){const label=DUTY_STATUS_MAP[key];const r={...dd};all.forEach(({name})=>{const p=Array.isArray(r[name])?r[name]:(r[name]?[r[name]]:[]);const has=p.includes(label);const assigned=names.includes(name);if(assigned&&!has)r[name]=[...p,label];else if(!assigned&&has)r[name]=p.filter(s=>s!==label);});r[key]=names;return r;}
function syncMemberToDuty(dd,name,sts){const r={...dd};r[name]=sts;Object.entries(DUTY_STATUS_MAP).forEach(([key,label])=>{const p=Array.isArray(r[key])?r[key]:(r[key]?[r[key]]:[]);const has=sts.includes(label);const inD=p.includes(name);if(has&&!inD)r[key]=[...p,name];else if(!has&&inD)r[key]=p.filter(n=>n!==name);});return r;}
function getDutyArr(nd,ds,key){const v=nd[ds]?.[key];return Array.isArray(v)?v:(v?[v]:[]);}
function getStatuses(ds,name){const v=state.data[ds]?.[name];if(!v)return[];return Array.isArray(v)?v:[v];}
function getDutyNames(ds,key){return getDutyArr(state.data,ds,key);}
function commitDuty(ds,key,names){const d=applyLinkedDuty(state.data,ds,key,names);setState({data:d},true);}
function commitMemberSilent(ds,name,sts){
  let d={...state.data};const dd={...(d[ds]||{})};
  d[ds]=syncMemberToDuty(dd,name,sts);
  const checked=new Set(sts.filter(s=>DUTY_LABELS.includes(s)));
  const r=applyLinkedDutyForMember(d,ds,name,checked);
  state.data=r.data;scheduleSave();
  return r.affected;
}
function mainMembers(){return state.members.filter(m=>m.category==='main');}
function subMembers(){return state.members.filter(m=>m.category==='sub');}
function days(){return getMonthDays(state.year,state.month);}

const ABSENT=['公休','有休','午前半休','午後半休'];
function availMain(ds){return mainMembers().map(m=>m.name).filter(n=>!getStatuses(ds,n).some(s=>ABSENT.includes(s)));}
function buildCount(nd){const c={};mainMembers().forEach(m=>{c[m.name]=0;});days().forEach(d=>{const ds=toDS(d);DUTY_COLS.forEach(dc=>{getDutyArr(nd,ds,dc.key).forEach(n=>{if(c[n]!==undefined)c[n]++;});});});return c;}
function adjDS(ds,delta){const d=new Date(ds);d.setDate(d.getDate()+delta);return d.toISOString().slice(0,10);}
function buildPool(avail,nd,ds,count,opts){if(!avail.length)return[];return[...avail].sort((a,b)=>{let sa=0,sb=0;const pDS=adjDS(ds,-1);if(opts.consec){const aP=DUTY_COLS.some(dc=>getDutyArr(nd,pDS,dc.key).includes(a));const bP=DUTY_COLS.some(dc=>getDutyArr(nd,pDS,dc.key).includes(b));sa+=aP?-5:0;sb+=bP?-5:0;}if(opts.noConsec){const aP=DUTY_COLS.some(dc=>getDutyArr(nd,pDS,dc.key).includes(a));const bP=DUTY_COLS.some(dc=>getDutyArr(nd,pDS,dc.key).includes(b));sa+=aP?+10:0;sb+=bP?+10:0;}sa+=(count[a]||0);sb+=(count[b]||0);return sa-sb;});}
function applyDuty(nd,ds,key,names){const dd={...(nd[ds]||{})};return{...nd,[ds]:syncDutyToMembers(dd,key,names,state.members)};}

// 事務所番・金庫番・掃除のうち、当日「同一人物」ルールが適用される担当キー一覧を返す
// 土日祝：3つ全部 / 平日：金庫番・掃除のみ（事務所番は対象外）
function linkedDutyKeys(date){return isReq(date)?['__office__','__safe__','__clean__']:['__safe__','__clean__'];}

// 担当欄モーダル側：keyに設定したnamesを、連動グループの全キーに反映する
function applyLinkedDuty(nd,ds,key,names){
  const keys=linkedDutyKeys(new Date(ds));
  const targets=keys.includes(key)?keys:[key];
  let d=nd;
  targets.forEach(k=>{d=applyDuty(d,ds,k,names);});
  return d;
}

// メンバー別ボトムパネル側：nameの当番チェック状態(checkedLabels)から連動グループを更新する。
// どれか1つでもチェックされていればグループ全体を[name]に、どれもチェックされていなければグループから除外する。
// 戻り値affectedは、担当欄の中身が変わった可能性のあるメンバー名（DOM直更新の対象）。
function applyLinkedDutyForMember(nd,ds,name,checkedLabels){
  const keys=linkedDutyKeys(new Date(ds));
  const anyChecked=keys.some(k=>checkedLabels.has(DUTY_STATUS_MAP[k]));
  const affected=new Set([name]);
  let d=nd;
  keys.forEach(k=>{
    const before=getDutyArr(d,ds,k);
    const after=anyChecked?[name]:before.filter(n=>n!==name);
    if(JSON.stringify(before)!==JSON.stringify(after)){
      before.forEach(n=>affected.add(n));
      after.forEach(n=>affected.add(n));
      d=applyDuty(d,ds,k,after);
    }
  });
  return{data:d,affected:[...affected]};
}

/**
 * 自動振り分けロジック（改訂版）
 * ルール:
 *   土日祝 → 事務所番・金庫番・掃除を同一人物
 *   平日   → 金庫番・掃除を同一人物（事務所番は不要）
 * 返り値: { data: 更新後データ, alerts: 割り当て不可日リスト }
 */
function runAutoAssign(nd,opts,skip){
  const count=buildCount(nd);
  const alerts=[]; // 担当者不足の日

  days().forEach(d=>{
    const ds=toDS(d);
    const wkEnd=isReq(d); // 土日祝
    const avail=availMain(ds);

    if(wkEnd){
      // ── 土日祝：事務所番・金庫番・掃除を同一人物 ──
      const offEx=getDutyArr(nd,ds,'__office__');
      const safeEx=getDutyArr(nd,ds,'__safe__');
      const cleanEx=getDutyArr(nd,ds,'__clean__');
      const allSet=offEx.length&&safeEx.length&&cleanEx.length;
      if(skip&&allSet)return; // スキップモードで全設定済みならパス

      // 既に誰かが設定されていればその人を使う（優先順位: 事務所番>金庫番>掃除）
      let chosen=offEx[0]||safeEx[0]||cleanEx[0]||null;
      if(!chosen){
        const pool=buildPool(avail,nd,ds,count,opts);
        if(!pool.length){
          alerts.push((d.getMonth()+1)+'/'+d.getDate()+'('+dayLbl(d)+') 土日祝');
          return;
        }
        chosen=pool[0];
      }
      // 3列すべて同一人物に設定
      nd=applyDuty(nd,ds,'__office__',[chosen]);
      nd=applyDuty(nd,ds,'__safe__',[chosen]);
      nd=applyDuty(nd,ds,'__clean__',[chosen]);
      count[chosen]=(count[chosen]||0)+3;

    } else {
      // ── 平日：金庫番・掃除を同一人物（事務所番は不要）──
      const safeEx=getDutyArr(nd,ds,'__safe__');
      const cleanEx=getDutyArr(nd,ds,'__clean__');
      const bothSet=safeEx.length&&cleanEx.length;
      if(skip&&bothSet)return;

      // 既に片方が設定されていればその人を使う
      let chosen=safeEx[0]||cleanEx[0]||null;
      if(!chosen){
        const pool=buildPool(avail,nd,ds,count,opts);
        if(!pool.length){
          alerts.push((d.getMonth()+1)+'/'+d.getDate()+'('+dayLbl(d)+') 平日');
          return;
        }
        chosen=pool[0];
      }
      nd=applyDuty(nd,ds,'__safe__',[chosen]);
      nd=applyDuty(nd,ds,'__clean__',[chosen]);
      count[chosen]=(count[chosen]||0)+2;
    }
  });

  return {data:nd, alerts};
}

function autoAssignPreview(){

  });

}

// DOM HELPERS
function el(tag,attrs,children){const e=document.createElement(tag);if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='className')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);else e.setAttribute(k,v);});if(children)(Array.isArray(children)?children:[children]).forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});return e;}
function div(s,ch){return el('div',{style:s},ch);}
function btn(s,onclick,ch){return el('button',{style:s,onClick:onclick},ch);}
function span(s,t){return el('span',{style:s},[t]);}
function txt(t){return document.createTextNode(t);}

  return h;

// ── ボタン行レンダラ（共通）
// テーブルセルのバッジ表示をDOM直接更新（rerenderなし）
function updateCellDisplay(ds,name,sts){
  const cell=document.querySelector('[data-cell="'+ds+'__'+name+'"]');
  if(!cell)return;

  // 当番（事務所番・金庫番・掃除）は文字バッジではなく担当者カラーの塗りつぶしで表示する
  const onDuty=DUTY_COLS.some(dc=>getDutyNames(ds,dc.key).includes(name));
  // スケジュール系ラベルのみバッジ表示（夜間現場→現場、責任者除外、当番ラベルは除外）
  const scheduleSts=sts.filter(s=>s!=='責任者'&&!DUTY_LABELS.includes(s)).map(s=>s==='夜間現場'?'現場':s);

  const mc=getMemberColor(name);
  const isOpen=state.bottomPanel&&state.bottomPanel.member===name&&state.bottomPanel.dateStr===ds;
  const ss=STATUS_STYLE[scheduleSts[0]];
  const defaultBg=onDuty?mc:(ss?ss.bg:'');

  // 背景はisOpenのハイライト or 当番カラー／ステータス色
  if(!isOpen){
    cell.style.background=defaultBg;
  }
  cell.setAttribute('data-default-bg',defaultBg);

  // バッジ部分だけ再構築（既存の inner div を探して置き換え）
  const existingInner=cell.querySelector('div');
  if(existingInner)existingInner.remove();

  if(scheduleSts.length){
    const inner=document.createElement('div');
    inner.style.cssText='display:flex;flex-wrap:wrap;gap:1px;justify-content:center;';
    scheduleSts.forEach(st=>{
      const s=STATUS_STYLE[st];
      const badge=document.createElement('span');
      badge.style.cssText='background:'+(s?.bg||'#eee')+';color:'+(s?.text||'#333')+';border:1px solid '+(s?.border||'#ccc')+';border-radius:3px;padding:0 2px;font-size:9px;font-weight:600;white-space:nowrap;display:block;line-height:1.6;';
      badge.textContent=st;
      inner.appendChild(badge);
    });
    cell.appendChild(inner);
  }
}

function renderBtnRow(btnRow,ds,name,mc,showItems,localSts){
  function refreshBtn(st,b){
    const ss=STATUS_STYLE[st];
    const realSt=st==='現場'?'夜間現場':st;
    const isActive=localSts.includes(realSt);
    b.style.background=isActive?(ss?.bg||'#eef2ff'):'#f8f9fa';
    b.style.border='2px solid '+(isActive?(ss?.border||C.accent):'#e2e8f0');
    b.style.color=isActive?(ss?.text||C.accent):'#64748b';
    b.style.fontWeight=isActive?'700':'500';
    b.innerHTML='';
    if(isActive){const chk=document.createElement('span');chk.textContent='✓';chk.style.cssText='font-size:11px;font-weight:700;flex-shrink:0;pointer-events:none;';b.appendChild(chk);}
    b.appendChild(document.createTextNode(st));
  }
  const btnMap={};
  showItems.forEach(st=>{
    const realSt=st==='現場'?'夜間現場':st;
    const b=document.createElement('button');
    Object.assign(b.style,{flexShrink:'0',padding:'10px 16px',fontSize:'13px',borderRadius:'10px',cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:'5px'});
    refreshBtn(st,b);btnMap[st]=b;
    if(st==='公休'){
      let lpTimer=null;
      const startLP=()=>{lpTimer=setTimeout(()=>{lpTimer=null;openCalendarMode(ds,name,mc);},600);};
      const endLP=()=>{clearTimeout(lpTimer);lpTimer=null;};
      b.addEventListener('mousedown',startLP);b.addEventListener('mouseup',endLP);b.addEventListener('mouseleave',endLP);
      b.addEventListener('touchstart',startLP,{passive:true});b.addEventListener('touchend',endLP);b.addEventListener('touchcancel',endLP);
    }
    b.addEventListener('click',()=>{
      const idx=localSts.indexOf(realSt);
      if(idx>=0)localSts.splice(idx,1);else localSts.push(realSt);
      refreshBtn(st,b);
      const affected=commitMemberSilent(ds,name,[...localSts]);
      // 事務所番・金庫番・掃除は連動するため、影響を受けた他メンバーのセルも更新する
      affected.forEach(n=>updateCellDisplay(ds,n,getStatuses(ds,n)));
    });
    btnRow.appendChild(b);
  });
  // セパレータ＋クリア
  btnRow.appendChild(div({width:'1px',height:'32px',background:C.border,flexShrink:'0'}));
  const clearB=document.createElement('button');
  Object.assign(clearB.style,{flexShrink:'0',padding:'10px 14px',fontSize:'12px',fontWeight:'600',borderRadius:'10px',cursor:'pointer',fontFamily:'inherit',background:'#f1f5f9',border:'1.5px solid #e2e8f0',color:'#64748b',whiteSpace:'nowrap'});
  clearB.textContent='クリア';
  clearB.addEventListener('click',()=>{
    localSts.length=0;
    showItems.forEach(st=>{if(btnMap[st])refreshBtn(st,btnMap[st]);});
    const affected=commitMemberSilent(ds,name,[]);
    affected.forEach(n=>updateCellDisplay(ds,n,getStatuses(ds,n)));
  });
  btnRow.appendChild(clearB);
}

// カレンダー本体をパネル内に構築
function buildCalendarInPanel(container,ds,name,mc){
  const sy=state.year,sm2=state.month;
  let prevY=sy,prevM=sm2-1;if(prevM<1){prevM=12;prevY--;}
  const startDate=new Date(prevY,prevM-1,21);
  const endDate=new Date(sy,sm2-1,20);

  // 曜日ヘッダー
  const wdRow=document.createElement('div');
  wdRow.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);padding:6px 8px 2px;gap:3px;';
  ['日','月','火','水','木','金','土'].forEach((wd,i)=>{
    const c=document.createElement('div');
    c.style.cssText='text-align:center;font-size:11px;font-weight:700;padding:3px 0;color:'+(i===0?'#ef4444':i===6?'#3b82f6':'#94a3b8')+';';
    c.textContent=wd;
    wdRow.appendChild(c);
  });
  container.appendChild(wdRow);

  // 日付グリッド
  const grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);padding:2px 8px 10px;gap:4px;';

  // オフセット
  const firstDow=startDate.getDay();
  for(let i=0;i<firstDow;i++) grid.appendChild(document.createElement('div'));

  let cur=new Date(startDate);
  while(cur<=endDate){
    const d=new Date(cur);
    const dstr=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dow=d.getDay();
    const sts=getStatuses(dstr,name).filter(s=>s!=='責任者');
    const hasKyukyu=sts.includes('公休');
    const displayOther=sts.map(s=>s==='夜間現場'?'現場':s).filter(s=>['有休','午前半休','午後半休','現場'].includes(s));
    const isWkEnd=isWk(d)||isHol(d);
    const isToday=dstr===TODAY_DS;

    const cell=document.createElement('div');
    cell.setAttribute('data-cal-date',dstr);
    Object.assign(cell.style,{
      borderRadius:'8px',padding:'6px 2px 4px',textAlign:'center',cursor:'pointer',
      border:'2px solid '+(hasKyukyu?STATUS_STYLE['公休'].border:isToday?mc:'transparent'),
      background:hasKyukyu?STATUS_STYLE['公休'].bg:isWkEnd?'#fef2f2':'#f8f9fa',
      minHeight:'44px',display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'flex-start',gap:'2px',
      userSelect:'none',WebkitUserSelect:'none',WebkitTapHighlightColor:'transparent',
    });

    const dateNum=document.createElement('div');
    dateNum.style.cssText='font-size:13px;font-weight:700;line-height:1.3;color:'+(
      hasKyukyu?STATUS_STYLE['公休'].text:isToday?mc:dow===0?'#ef4444':dow===6?'#3b82f6':'#1e293b')+';';
    dateNum.textContent=d.getDate();
    cell.appendChild(dateNum);

    displayOther.forEach(st=>{
      const ss=STATUS_STYLE[st];
      const badge=document.createElement('div');
      badge.style.cssText='font-size:7px;font-weight:700;color:'+(ss?.text||'#333')+';background:'+(ss?.bg||'#eee')+';border-radius:2px;padding:1px 2px;line-height:1.3;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;';
      badge.textContent=st;
      cell.appendChild(badge);
    });

    cell.addEventListener('click',()=>{
      const cur2=getStatuses(dstr,name).filter(s=>s!=='責任者');
      const next=cur2.includes('公休')?cur2.filter(s=>s!=='公休'):[...cur2,'公休'];
      commitMemberSilent(dstr,name,next);
      updateCellDisplay(dstr,name,next);
      const nowHas=next.includes('公休');
      cell.style.background=nowHas?STATUS_STYLE['公休'].bg:isWkEnd?'#fef2f2':'#f8f9fa';
      cell.style.borderColor=nowHas?STATUS_STYLE['公休'].border:isToday?mc:'transparent';
      dateNum.style.color=nowHas?STATUS_STYLE['公休'].text:isToday?mc:dow===0?'#ef4444':dow===6?'#3b82f6':'#1e293b';
    });

    grid.appendChild(cell);
    cur.setDate(cur.getDate()+1);
  }
  container.appendChild(grid);
}

function buildTable(ds,mm,sm){
  const {editMode}=state;const W={date:54,day:28,duty:96,sep:2,member:52};
  const wrap=div({overflowX:'auto',overflowY:'visible',WebkitOverflowScrolling:'touch',padding:'0 0 16px 0'});wrap.id='shift-table-wrap';
  const tbl=el('table',{style:{borderCollapse:'separate',borderSpacing:'0',tableLayout:'fixed',minWidth:(W.date+W.day+DUTY_COLS.length*W.duty+W.sep+mm.length*W.member+(sm.length?(W.sep+sm.length*W.member):0))+'px'}});
  const cg=el('colgroup');
  [{w:W.date},{w:W.day},...DUTY_COLS.map(()=>({w:W.duty})),{w:W.sep},...mm.map(()=>({w:W.member})),...(sm.length?[{w:W.sep}]:[]),...sm.map(()=>({w:W.member}))].forEach(({w})=>{const c=el('col');c.style.width=w+'px';cg.appendChild(c);});
  tbl.appendChild(cg);
  function mkTh(t,s){const th=el('th',{style:{padding:'8px 2px',fontWeight:'700',fontSize:'11px',textAlign:'center',whiteSpace:'nowrap',overflow:'hidden',border:'1px solid '+C.border,background:'#fff',position:'sticky',top:'0',zIndex:'10',...s}});if(t)th.appendChild(document.createTextNode(t));return th;}
  const thead=el('thead');const tr1=el('tr');
  tr1.appendChild(mkTh('日付',{color:C.muted}));tr1.appendChild(mkTh('曜',{color:C.muted}));
  DUTY_COLS.forEach(dc=>tr1.appendChild(mkTh(dc.label,{background:dc.lightBg,color:dc.accent,borderLeft:'2px solid '+C.strong,borderRight:'2px solid '+C.strong})));
  tr1.appendChild(mkTh('',{padding:'0',background:C.strong,border:'none'}));
  mm.forEach(m=>{
    const mc=getMemberColor(m.name);
    tr1.appendChild(mkTh(m.name,{background:mc+'22',color:mc,borderBottom:'2px solid '+mc}));
  });
  if(sm.length)tr1.appendChild(mkTh('',{padding:'0',background:C.subBorder,border:'none'}));
  sm.forEach(m=>tr1.appendChild(mkTh(m.name,{background:C.subBg,color:C.subCat})));
  thead.appendChild(tr1);tbl.appendChild(thead);
  const tbody=el('tbody');
  ds.forEach((date,di)=>{
    const dstr=toDS(date);const wkEnd=isWk(date)||isHol(date);const req=isReq(date);
    const rowBg=di%2===0?C.bg:C.bgAlt;
    const is20=date.getDate()===20,is21=date.getDate()===21;const dc=dayClr(date);
    const isToday=toDS(date)===TODAY_DS;
    // 案B：行背景は通常交互、日付＋曜日をカプセル型で囲む
    const todayRowBg=rowBg;
    const tr=el('tr',{style:{
      background:rowBg,
      borderTop:is21?'2px solid '+C.accent:'',
      borderBottom:is20?'2px solid '+C.accent:'',
    }});
    if(isToday)tr.setAttribute('data-today-row','1');
    const TB='2px solid #4f46e5'; // 今日の外枠色
    const TI='1px solid #c7d2fe'; // 今日の内側ボーダー
    function mkTd(s){return el('td',{style:{
      border:'1px solid '+(isToday?'#c7d2fe':C.border),
      padding:'3px 2px',height:'44px',verticalAlign:'middle',
      textAlign:'center',whiteSpace:'nowrap',overflow:'hidden',...s}});}
    const isSwapA=state.swapMode&&state.swapDayA===dstr;
    const isSwapB=state.swapMode&&state.swapDayB===dstr;
    // 日付セル：通常背景、カプセルはtd内部に描画
    const dateFg=isSwapA||isSwapB?'#fff':dc;
    const dateBg=isSwapA?'#db2777':isSwapB?'#7c3aed':rowBg;
    const dateTd=mkTd({
      color:dateFg,fontWeight:'700',fontSize:'12px',background:dateBg,
      position:'relative',cursor:state.swapMode?'pointer':'default',
      padding:'2px 2px',
      ...(isToday&&!isSwapA&&!isSwapB?{borderLeft:TB,borderTop:TB,borderBottom:TB,borderRight:TI}:{}),
    });
    if(isToday&&!isSwapA&&!isSwapB){
      // カプセル型ラッパー：日付＋曜日を包む（wdTdにもまたがるため日付セル内に「今日」バッジ）
      const cap=document.createElement('div');
      cap.style.cssText='background:#4f46e5;color:#fff;border-radius:8px;padding:4px 6px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;min-width:36px;';
      const dateSpan=document.createElement('span');
      dateSpan.style.cssText='font-size:12px;font-weight:700;';
      dateSpan.textContent=(date.getMonth()+1)+'/'+date.getDate();
      const todayLabel=document.createElement('span');
      todayLabel.style.cssText='font-size:8px;font-weight:600;opacity:0.85;';
      todayLabel.textContent='今日';
      cap.appendChild(dateSpan);
      cap.appendChild(todayLabel);
      dateTd.appendChild(cap);
    }else{
      dateTd.appendChild(document.createTextNode((date.getMonth()+1)+'/'+date.getDate()));
      if(isSwapA)dateTd.appendChild(el('span',{style:{fontSize:'8px',display:'block',color:'#fff'}},'日A'));
      if(isSwapB)dateTd.appendChild(el('span',{style:{fontSize:'8px',display:'block',color:'#fff'}},'日B'));
      if(isHol(date)&&!isSwapA&&!isSwapB)dateTd.appendChild(el('span',{style:{fontSize:'9px',color:C.sun,display:'block'}},['祝']));
    }
    // swap モード時のタップ処理
    if(state.swapMode){
      dateTd.addEventListener('click',()=>{
        if(!state.swapDayA){
          setState({swapDayA:dstr});
        } else if(state.swapDayA===dstr){
          setState({swapDayA:null}); // 選択解除
        } else if(!state.swapDayB){
          setState({swapDayB:dstr});
        } else {
          setState({swapDayB:dstr}); // B を更新
        }
      });
    }
    tr.appendChild(dateTd);
    const wdTd=mkTd({
      color:isToday?'#4f46e5':dc,
      fontWeight:'800',fontSize:'13px',
      background:rowBg,
      borderRight:'2px solid '+C.strong,
      ...(isToday?{borderTop:TB,borderBottom:TB,borderLeft:TI}:{}),
    });
    if(isToday){
      // 曜日もカプセルと統一してインディゴ太字
      const wdCap=document.createElement('div');
      wdCap.style.cssText='background:#eef2ff;color:#4f46e5;border-radius:6px;padding:4px 4px;font-size:13px;font-weight:800;display:inline-block;min-width:24px;';
      wdCap.textContent=dayLbl(date);
      wdTd.appendChild(wdCap);
    }else{
      wdTd.appendChild(document.createTextNode(dayLbl(date)));
    }
    tr.appendChild(wdTd);
    DUTY_COLS.forEach(dc2=>{
      const vals=getDutyNames(dstr,dc2.key);const needed=dc2.req?req:true;const miss=needed&&!vals.length;
      // ④ 今日の担当セル：lightBgを使いつつ強調ボーダー
      const cellBg=miss?'#fde8e8':vals.length?dc2.lightBg:todayRowBg;
      const isLastDuty=dc2.key===DUTY_COLS[DUTY_COLS.length-1].key;
      const dtd=mkTd({
        background:cellBg,
        borderLeft:'2px solid '+C.strong,
        borderRight:'2px solid '+C.strong,
        cursor:editMode==='edit'?'pointer':'default',
        padding:'4px 2px',
        ...(isToday?{borderTop:TB,borderBottom:TB,...(isLastDuty?{borderRight:TB}:{})}:{}),
      });
      if(editMode==='edit')dtd.addEventListener('click',()=>openDutyModal(dstr,dc2.key));
      if(miss)dtd.appendChild(el('span',{style:{color:C.warnText,fontSize:'10px',fontWeight:'700'}},['!']));
      else if(vals.length){
        const inner=div({display:'flex',flexWrap:'wrap',gap:'2px',justifyContent:'center'});
        vals.forEach(v=>{
          const mc=getMemberColor(v);
          // ④ 今日の担当バッジはやや大きく
          inner.appendChild(el('span',{style:{
            background:mc,color:'#fff',borderRadius:'4px',
            padding:'2px 5px',fontSize:'10px',
            fontWeight:'700',letterSpacing:'-0.02em',whiteSpace:'nowrap',
          }},[v]));
        });
        dtd.appendChild(inner);
      }
      else dtd.appendChild(el('span',{style:{color:C.muted,fontSize:'12px'}},['—']));
      tr.appendChild(dtd);
    });
    tr.appendChild(mkTd({padding:'0',background:C.strong,border:'none'}));
    [...mm,...(sm.length?[null]:[]),...sm].forEach(m=>{
      if(m===null){tr.appendChild(mkTd({padding:'0',background:C.subBorder,border:'none'}));return;}
      const rawSts=getStatuses(dstr,m.name).filter(s=>s!=='責任者');
      // 当番（事務所番・金庫番・掃除）はセル全体を担当者カラーで塗りつぶし、文字バッジは表示しない
      const onDuty=DUTY_COLS.some(dc2=>getDutyNames(dstr,dc2.key).includes(m.name));
      const scheduleSts=rawSts.filter(s=>!DUTY_LABELS.includes(s)).map(s=>s==='夜間現場'?'現場':s);
      const ss=STATUS_STYLE[scheduleSts[0]];
      const mc=getMemberColor(m.name);
      const defaultBg=onDuty?mc:(ss?ss.bg:rowBg);
      const mtd=mkTd({
        background:defaultBg,
        cursor:editMode==='edit'?'pointer':'default',
        padding:'3px 2px',
        borderLeft:'1px solid '+C.border,
      });
      mtd.setAttribute('data-cell',dstr+'__'+m.name);
      mtd.setAttribute('data-default-bg',defaultBg);
      if(editMode==='edit')mtd.addEventListener('click',()=>openMemberModal(dstr,m.name));
      if(scheduleSts.length){
        const inner=div({display:'flex',flexWrap:'wrap',gap:'1px',justifyContent:'center'});
        scheduleSts.forEach(st=>{
          const s=STATUS_STYLE[st];
          inner.appendChild(el('span',{style:{background:s?.bg||'#eee',color:s?.text||'#333',border:'1px solid '+(s?.border||'#ccc'),borderRadius:'3px',padding:'0 2px',fontSize:'9px',fontWeight:'600',whiteSpace:'nowrap',display:'block',lineHeight:'1.6'}},[st]));
        });
        mtd.appendChild(inner);
      }
      tr.appendChild(mtd);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);wrap.appendChild(tbl);return wrap;
}

// ── ボトムシート共通
function buildSheet(onClose){
  const ov=div({position:'fixed',inset:'0',background:'rgba(15,23,42,0.4)',zIndex:'200',display:'flex',alignItems:'flex-end',animation:'fadeIn 0.15s ease'});
  ov.addEventListener('click',onClose);
  const sheet=div({background:'#fff',borderRadius:'16px 16px 0 0',padding:'0 16px',paddingBottom:'max(24px,env(safe-area-inset-bottom))',width:'100%',maxHeight:'90vh',overflowY:'auto',animation:'slideUp 0.2s ease',WebkitOverflowScrolling:'touch'});
  sheet.addEventListener('click',e=>e.stopPropagation());
  sheet.appendChild(div({width:'36px',height:'3px',background:'#e2e8f0',borderRadius:'2px',margin:'10px auto 14px'}));
  ov.appendChild(sheet);return{ov,sheet};
}

// 🗑 リセットモーダル（担当 or スケジュール）

function buildResetModal(){
  const{ov,sheet}=buildSheet(()=>setState({showResetModal:false,activeAction:'edit'}));

  sheet.appendChild(div({fontSize:'16px',fontWeight:'700',
    color:'#1e293b',marginBottom:'4px'},['リセット']));
  sheet.appendChild(div({fontSize:'12px',color:C.muted,marginBottom:'16px'},
    [state.year+'年'+state.month+'月分のデータを選択してクリアします']));

  // ── 担当リセット ──
  const dutyCard=div({background:'#fde8e8',border:'1px solid '+C.warnBorder,
    borderRadius:'14px',padding:'14px 16px',marginBottom:'12px'});
  dutyCard.appendChild(div({fontWeight:'700',fontSize:'14px',color:C.warnText,
    marginBottom:'6px'},['🗑 担当欄リセット']));
  dutyCard.appendChild(div({fontSize:'12px',color:C.warnText,marginBottom:'12px',lineHeight:'1.6'},
    ['事務所番・金庫番・掃除の担当者をすべてクリアします。メンバーのスケジュールは残ります。']));
  dutyCard.appendChild(btn({width:'100%',background:C.warnText,color:'#fff',border:'none',
    borderRadius:'10px',padding:'12px',fontSize:'13px',fontWeight:'700',minHeight:'48px'},
    ()=>{
      if(!confirm(state.year+'年'+state.month+'月の担当欄をすべてクリアしますか？'))return;
      const nd={...state.data};
      days().forEach(d=>{
        const ds=toDS(d);if(!nd[ds])return;
        const dd={...(nd[ds])};
        DUTY_COLS.forEach(dc=>{
          const lbl=DUTY_STATUS_MAP[dc.key];
          dd[dc.key]=[];
          state.members.forEach(({name})=>{
            const p=Array.isArray(dd[name])?dd[name]:(dd[name]?[dd[name]]:[]);
            if(p.includes(lbl))dd[name]=p.filter(s=>s!==lbl);
          });
        });

      });
      setState({data:nd,showResetModal:false,activeAction:'edit'},true);
    },'担当欄をクリア'));
  sheet.appendChild(dutyCard);

  // ── スケジュールリセット ──
  const SCHEDULE_STS=['夜間現場','公休','有休','午前半休','午後半休'];
  const schedCard=div({background:'#ede8f5',border:'1px solid #c9b8dc',
    borderRadius:'14px',padding:'14px 16px',marginBottom:'12px'});
  schedCard.appendChild(div({fontWeight:'700',fontSize:'14px',color:'#7a5080',
    marginBottom:'6px'},['📅 スケジュールリセット']));
  schedCard.appendChild(div({fontSize:'12px',color:'#7a5080',marginBottom:'6px',lineHeight:'1.6'},
    ['メンバーのスケジュール（公休・有休・半休・夜間現場）をクリアします。担当欄（事務所番・金庫番・掃除）は残ります。']));

  // メンバー選択（個別 or 全員）
  const memberSel=div({marginBottom:'12px'});
  memberSel.appendChild(div({fontSize:'11px',color:'#7a5080',fontWeight:'700',marginBottom:'6px'},['対象メンバーを選択（複数可）']));
  const selSet=new Set(['__all__']);
  const memberGrid=div({display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(72px,1fr))',gap:'6px',marginBottom:'8px'});

  // 全員ボタン
  const allBtn=btn({background:'#7a5080',color:'#fff',border:'2px solid #7a5080',
    borderRadius:'8px',padding:'8px 4px',fontSize:'12px',fontWeight:'700',minHeight:'44px'},
    ()=>{
      if(selSet.has('__all__')){selSet.clear();}
      else{selSet.clear();selSet.add('__all__');}
      updateSelButtons();
    },'✓ 全員');
  memberGrid.appendChild(allBtn);

  // 個別メンバーボタン
  const memBtns={};
  state.members.forEach(m=>{
    const b=btn({background:'#f5f5f5',color:C.text,border:'2px solid '+C.border,
      borderRadius:'8px',padding:'8px 4px',fontSize:'12px',fontWeight:'500',minHeight:'44px'},
      ()=>{
        selSet.delete('__all__');
        if(selSet.has(m.name))selSet.delete(m.name);
        else selSet.add(m.name);
        updateSelButtons();
      },m.name);
    memBtns[m.name]=b;
    memberGrid.appendChild(b);
  });

  function updateSelButtons(){
    const isAll=selSet.has('__all__');
    allBtn.style.background=isAll?'#7a5080':'#f5f5f5';
    allBtn.style.color=isAll?'#fff':'#3d1f2a';
    allBtn.textContent=isAll?'✓ 全員':'全員';
    state.members.forEach(m=>{
      const sel=selSet.has(m.name);
      memBtns[m.name].style.background=sel?'#ede8f5':'#f5f5f5';
      memBtns[m.name].style.color=sel?'#7a5080':C.text;
      memBtns[m.name].style.border='2px solid '+(sel?'#7a5080':C.border);
      memBtns[m.name].style.fontWeight=sel?'700':'500';
    });
  }
  updateSelButtons();
  memberSel.appendChild(memberGrid);
  schedCard.appendChild(memberSel);

  schedCard.appendChild(btn({width:'100%',background:'#7a5080',color:'#fff',border:'none',
    borderRadius:'10px',padding:'12px',fontSize:'13px',fontWeight:'700',minHeight:'48px'},
    ()=>{
      const targets=selSet.has('__all__')?state.members.map(m=>m.name):[...selSet];
      if(!targets.length){alert('対象メンバーを選択してください');return;}
      const label=selSet.has('__all__')?'全員':'選択メンバー';
      if(!confirm(state.year+'年'+state.month+'月の'+label+'のスケジュールをクリアしますか？'))return;
      const nd={...state.data};
      days().forEach(d=>{
        const ds=toDS(d);if(!nd[ds])return;
        const dd={...(nd[ds])};
        targets.forEach(name=>{
          const cur=Array.isArray(dd[name])?dd[name]:(dd[name]?[dd[name]]:[]);
          // 担当ラベルは残し、スケジュールのみ削除
          dd[name]=cur.filter(s=>!SCHEDULE_STS.includes(s));
        });
        nd[ds]=dd;
      });
      setState({data:nd,showResetModal:false,activeAction:'edit'},true);
    },'スケジュールをクリア'));
  sheet.appendChild(schedCard);

  // キャンセル
  sheet.appendChild(btn({width:'100%',background:'#f1f5f9',border:'none',color:'#64748b',
    borderRadius:'12px',padding:'14px',fontSize:'13px',minHeight:'52px'},
    ()=>setState({showResetModal:false,activeAction:'edit'}),'キャンセル'));

  return ov;
}

// ── ASSIGN MODAL
function buildAssignModal(){
  // ローカルオプション管理（再描画なし）
  const localOpts={...state.assignOpts};
  const{ov,sheet}=buildSheet(()=>setState({showAssign:false}));

  sheet.appendChild(div({fontSize:'16px',fontWeight:'700',color:'#1e293b',marginBottom:'4px'},['自動振り分け']));
  sheet.appendChild(div({fontSize:'12px',color:C.muted,marginBottom:'16px'},['メインメンバーのみ。公休・有休・半休の人は除外。']));

  // オプション行ビルダー（DOMダイレクト更新）
  function buildOptRow(label,desc,key,color,bg,border,getDisabled){
    const row=div({display:'flex',alignItems:'flex-start',gap:'12px',
      borderRadius:'12px',padding:'14px',marginBottom:'10px',minHeight:'60px',
      cursor:'pointer',transition:'background 0.1s',
    });
    const chk=div({width:'22px',height:'22px',borderRadius:'5px',flexShrink:'0',marginTop:'1px',
      display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px',color:'#fff',fontWeight:'700',
    });
    const labelDiv=div({fontSize:'13px',fontWeight:'700',marginBottom:'2px'});
    const descDiv=div({fontSize:'11px',color:C.muted});
    const t2=div({});t2.appendChild(labelDiv);t2.appendChild(descDiv);
    row.appendChild(chk);row.appendChild(t2);

    function refresh(){
      const checked=localOpts[key];
      const disabled=getDisabled();
      row.style.background=checked?bg:'#f8f9fa';
      row.style.border='1.5px solid '+(checked?border:'#e2e8f0');
      row.style.opacity=disabled?'0.4':'1';
      row.style.cursor=disabled?'not-allowed':'pointer';
      chk.style.background=checked?color:'#fff';
      chk.style.border='1.5px solid '+(checked?color:'#e2e8f0');
      chk.textContent=checked?'✓':'';
      labelDiv.textContent=label;
      labelDiv.style.color=checked?color:'#1e293b';
      descDiv.textContent=desc;
    }
    refresh();

    row.addEventListener('click',()=>{
      if(getDisabled())return;
      localOpts[key]=!localOpts[key];
      // 排他制御
      if(key==='consec'&&localOpts.consec)localOpts.noConsec=false;
      if(key==='noConsec'&&localOpts.noConsec)localOpts.consec=false;
      // 全オプション行を再フレッシュ（DOM直接更新）
      allRows.forEach(r=>r.refresh());
    });
    return{row,refresh};
  }

  const allRows=[];
  const opts=[
    {label:'金庫番と掃除を同一人物にセット',desc:'同日の金庫番・掃除を同一人物に割り当て',
      key:'pair',color:'#d97706',bg:'#fffbeb',border:'#fde68a',dis:()=>false},
    {label:'担当が連日になるように',desc:'前日担当者を優先して翌日も割り当て',
      key:'consec',color:'#059669',bg:'#ecfdf5',border:'#a7f3d0',dis:()=>localOpts.noConsec},
    {label:'担当が連日にならないように',desc:'前日担当者を避けて割り当て',
      key:'noConsec',color:'#2563eb',bg:'#eff6ff',border:'#bfdbfe',dis:()=>localOpts.consec},
  ];
  opts.forEach(o=>{
    const{row,refresh}=buildOptRow(o.label,o.desc,o.key,o.color,o.bg,o.border,o.dis);
    allRows.push({refresh});
    sheet.appendChild(row);
  });

  sheet.appendChild(div({borderTop:'1px solid '+C.border,margin:'8px 0 14px'}));

  // プレビュー件数
  const prev=autoAssignPreview();

  // アクションボタン
  [{label:'未設定欄のみ振り分け'+(prev>0?' ('+prev+'件)':''),
    bg:'#4f46e5',color:'#fff',border:'none',
    action:()=>{
      const r=runAutoAssign({...state.data},localOpts,true);
      setState({data:r.data,showAssign:false,assignOpts:localOpts},true);
      showAssignAlerts(r.alerts);
    }},
   {label:'全体を再振り分け（上書き）',
    bg:'#fff',color:'#4f46e5',border:'1.5px solid #4f46e5',
    action:()=>{
      const r=runAutoAssign({...state.data},localOpts,false);
      setState({data:r.data,showAssign:false,assignOpts:localOpts},true);
      showAssignAlerts(r.alerts);
    }},
   {label:'担当欄をリセット',
    bg:'#fff',color:C.warnText,border:'1px solid '+C.warnBorder,
    action:()=>{
      const nd={...state.data};
      days().forEach(d=>{
        const ds=toDS(d);if(!nd[ds])return;
        const dd={...(nd[ds])};
        DUTY_COLS.forEach(dc=>{
          const lbl=DUTY_STATUS_MAP[dc.key];dd[dc.key]=[];
          state.members.forEach(({name})=>{
            const p=Array.isArray(dd[name])?dd[name]:(dd[name]?[dd[name]]:[]);
            if(p.includes(lbl))dd[name]=p.filter(s=>s!==lbl);
          });
        });
        nd[ds]=dd;
      });
      setState({data:nd,showAssign:false,assignOpts:localOpts},true);
    }},
  ].forEach(({label,bg,color,border,action})=>{
    sheet.appendChild(btn({
      width:'100%',marginBottom:'8px',background:bg,color,
      border:border||'none',borderRadius:'10px',padding:'14px',
      fontSize:'13px',fontWeight:'600',minHeight:'52px',
    },action,label));
  });

  sheet.appendChild(btn({
    width:'100%',background:'#f1f5f9',border:'none',color:C.sub,
    borderRadius:'10px',padding:'14px',fontSize:'13px',minHeight:'52px',
  },()=>setState({showAssign:false}),'キャンセル'));

  return ov;
}


// ── MODALS
function openDutyModal(ds,key){setState({modal:{kind:'duty',dateStr:ds,dutyKey:key}});}
function openMemberModal(ds,name){
  const isSame=state.bottomPanel&&state.bottomPanel.member===name&&state.bottomPanel.dateStr===ds;
  if(isSame){clearAllCellHighlight();setState({bottomPanel:null});return;}
  // パネルが既に開いている→中身だけDOM更新（rerenderなし）
  if(state.bottomPanel){
    state.bottomPanel={dateStr:ds,member:name,tab:'default'};
    updateBottomPanelDOM(ds,name,'default');
    return;
  }
  // 初回オープン：スクロール位置を保存→rerender→スクロール復元＋ハイライト適用
  const tw=document.getElementById('shift-table-wrap');
  const savedScroll=tw?tw.scrollLeft:0;
  setState({bottomPanel:{dateStr:ds,member:name,tab:'default'}});
  requestAnimationFrame(()=>{
    const tw2=document.getElementById('shift-table-wrap');
    if(tw2)tw2.scrollLeft=savedScroll;
    const mem=state.members.find(m=>m.name===name);
    const mc2=mem?.category==='main'?getMemberColor(name):C.muted;
    updateTableHighlight(ds,name,mc2);
  });
}
// パネルのDOM内容だけ更新（rerenderなし）
function updateBottomPanelDOM(ds,name,tab){
  const panel=document.getElementById('bottom-panel');
  if(!panel)return;
  const d=new Date(ds);
  const wkEnd=isWk(d)||isHol(d);
  const mem=state.members.find(m=>m.name===name);
  const mc=mem?.category==='main'?getMemberColor(name):C.muted;
  const ALL_STS=['公休','有休','午前半休','午後半休','現場','事務所番','金庫番','掃除','夜間現場'];
  const localSts=getStatuses(ds,name).filter(s=>s!=='責任者');

  // ボーダー色更新
  panel.style.borderTopColor=mc;

  // ヘッダー更新
  const hdrName=document.getElementById('bp-member-name');
  if(hdrName){hdrName.textContent=name;hdrName.style.background=mc;}
  const hdrDate=document.getElementById('bp-date');
  if(hdrDate){
    hdrDate.innerHTML='';
    const dow2=d.getDay();
    const dowColor2=isHol(d)||dow2===0?'#ef4444':dow2===6?'#3b82f6':'#64748b';
    const dn=document.createElement('span');dn.style.cssText='font-size:14px;font-weight:700;color:#1e293b;';dn.textContent=(d.getMonth()+1)+'/'+d.getDate();
    const dw=document.createElement('span');dw.style.cssText='font-size:13px;font-weight:700;color:'+dowColor2+';';dw.textContent=dayLbl(d)+(isHol(d)?'祝':'');
    hdrDate.appendChild(dn);hdrDate.appendChild(dw);
    hdrDate.style.display='';
  }

  // タブ非表示（廃止）を解除してそのまま
  const tabWrapEl=document.getElementById('bp-tab-wrap');
  if(tabWrapEl)tabWrapEl.style.display='none';

  // ボタン行を再構築
  const btnRow=document.getElementById('bp-btn-row');
  if(!btnRow)return;
  btnRow.innerHTML='';
  btnRow.style.cssText='display:flex;gap:6px;padding:8px 14px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:center;';
  renderBtnRow(btnRow,ds,name,mc,ALL_STS,localSts);

  // テーブルのハイライトを更新
  updateTableHighlight(ds,name,mc);
}
// テーブルセルのハイライトをDOM直接更新
function updateTableHighlight(ds,name,mc){
  // 前のハイライトを消す
  document.querySelectorAll('[data-cell-open]').forEach(el=>{
    el.removeAttribute('data-cell-open');
    el.style.outline='none';
    // 元の背景に戻す（完全には戻せないがoutlineを消すだけで十分）
  });
  // 新しいセルにハイライト
  const cell=document.querySelector('[data-cell="'+ds+'__'+name+'"]');
  if(cell){
    cell.setAttribute('data-cell-open','1');
    cell.style.outline='2px solid '+mc;
    cell.style.outlineOffset='-2px';
  }
}

    const b=document.createElement('button');
    Object.assign(b.style,{
      background:'#f8f9fa',border:'1.5px solid #e2e8f0',color:'#64748b',
      borderRadius:'8px',padding:'6px 12px',fontSize:'12px',fontWeight:'400',
      cursor:'pointer',fontFamily:'inherit',transition:'all 0.1s',
    });
    b.textContent=m.name;
    personBtns[m.name]=b;
    b.addEventListener('click',()=>{
      selectedPerson=selectedPerson===m.name?null:m.name;
      // 全ボタン更新
      mm.forEach(m2=>{
        const isActive=selectedPerson===m2.name;
        const mc2=getMemberColor(m2.name);
        const pb=personBtns[m2.name];
        pb.style.background=isActive?mc2+'22':'#f8f9fa';
        pb.style.border='1.5px solid '+(isActive?mc2:'#e2e8f0');
        pb.style.color=isActive?mc2:'#64748b';
        pb.style.fontWeight=isActive?'700':'400';
      });
      // 選択状態に応じてグリッドの活性状態を更新
      updateDateGrid();
    });
    singleSelWrap.appendChild(b);
  });
  multiBody.appendChild(singleSelWrap);

  // 日付グリッド
  const selectedDates=new Set();
  const dateGrid=div({display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px',maxHeight:'200px',overflowY:'auto',marginBottom:'10px'});
  const dateBtns={};

  function updateDateGrid(){
    days().forEach(d=>{
      const ds=toDS(d);
      const b=dateBtns[ds];if(!b)return;
      const sel=selectedDates.has(ds);
      const mc=selectedPerson?getMemberColor(selectedPerson):null;
      b.style.opacity=selectedPerson?'1':'0.4';
      b.style.cursor=selectedPerson?'pointer':'not-allowed';
      b.style.background=sel&&mc?mc+'22':'#f8f9fa';
      b.style.border='1.5px solid '+(sel&&mc?mc:'#e2e8f0');
      b.style.color=sel&&mc?mc:dayClr(d);
      b.style.fontWeight=sel?'700':'400';
    });
    applyMultiBtn.style.background=(selectedPerson&&selectedDates.size>0)?C.accent:'#e2e8f0';
    applyMultiBtn.style.cursor=(selectedPerson&&selectedDates.size>0)?'pointer':'not-allowed';

  }

  days().forEach(d=>{
    const ds=toDS(d);
    const b=document.createElement('button');
    Object.assign(b.style,{
      background:'#f8f9fa',border:'1.5px solid #e2e8f0',
      borderRadius:'6px',padding:'6px 2px',fontSize:'11px',

      justifyContent:'center',cursor:'not-allowed',opacity:'0.4',

    dateGrid.appendChild(b);

    width:'100%',background:'#e2e8f0',color:'#fff',border:'none',

    minHeight:'44px',cursor:'not-allowed',fontFamily:'inherit',

      const next=cur.includes(selectedPerson)?cur:[...cur,selectedPerson];
      d=applyLinkedDuty(d,ds,modal.dutyKey,next);
    });
    setState({data:d,modal:null},true);
  });
  multiBody.appendChild(applyMultiBtn);
  updateDateGrid();
  multiSection.appendChild(multiBody);
  wrap.appendChild(multiSection);
  return wrap;
}

// ④ 月またぎ担当連続確認
// ============================================================
function buildMonthBoundaryCheck(){
  const section=div({background:'#fff',border:'1px solid #e2e8f0',borderRadius:'14px',
    padding:'14px',marginBottom:'20px'});

  const hdr=div({display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'});
  hdr.appendChild(div({fontWeight:'700',fontSize:'14px',color:'#1e293b'},['月またぎ担当連続確認']));

  // 前月・今月の計算
  const prevM=state.month===1?12:state.month-1;
  const prevY=state.month===1?state.year-1:state.year;
  hdr.appendChild(div({fontSize:'11px',color:C.muted},[prevY+'年'+prevM+'月末 → '+state.year+'年'+state.month+'月頭']));
  section.appendChild(hdr);

  // 前月末7日 + 今月頭7日を対象
  const prevDays=getMonthDays(prevY,prevM).slice(-7);
  const currDays=getMonthDays(state.year,state.month).slice(0,7);

  let hasAny=false;

  DUTY_COLS.forEach(dc=>{
    // 各メンバーの連続日数を計算
    const allDays=[...prevDays,...currDays];
    const memberStreaks={};

    state.members.filter(m=>m.category==='main').forEach(m=>{
      const streakDays=[];
      // 後ろから連続を確認
      let inStreak=false;
      // 前後に分けてカウント
      const prevAssigned=prevDays.filter(d=>getDutyArr(state.data,toDS(d),dc.key).includes(m.name));
      const currAssigned=currDays.filter(d=>getDutyArr(state.data,toDS(d),dc.key).includes(m.name));

      // 前月末から連続しているか確認
      let prevConsec=0;
      for(let i=prevDays.length-1;i>=0;i--){
        if(getDutyArr(state.data,toDS(prevDays[i]),dc.key).includes(m.name)) prevConsec++;
        else break;
      }
      // 今月頭から連続しているか確認
      let currConsec=0;
      for(let i=0;i<currDays.length;i++){
        if(getDutyArr(state.data,toDS(currDays[i]),dc.key).includes(m.name)) currConsec++;
        else break;
      }

      if(prevConsec>0&&currConsec>0){
        memberStreaks[m.name]={prevConsec,currConsec,total:prevConsec+currConsec,color:getMemberColor(m.name)};
      }
    });

    const entries=Object.entries(memberStreaks);
    if(!entries.length)return;
    hasAny=true;

    const colSec=div({marginBottom:'12px'});
    const colHdr=div({display:'flex',alignItems:'center',gap:'6px',marginBottom:'8px'});
    colHdr.appendChild(div({
      background:dc.lightBg,color:dc.accent,fontSize:'11px',fontWeight:'700',
      borderRadius:'6px',padding:'3px 8px',border:'1px solid '+dc.accent,
    },[dc.label]));
    colSec.appendChild(colHdr);

    entries.forEach(([name,{prevConsec,currConsec,total,color}])=>{
      const isWarn=total>=4;
      const row=div({
        display:'flex',alignItems:'center',gap:'8px',
        background:isWarn?'#fef2f2':'#f8f9fa',
        border:'1px solid '+(isWarn?'#fca5a5':'#e2e8f0'),
        borderRadius:'10px',padding:'10px 12px',marginBottom:'6px',
        borderLeft:'4px solid '+color,
      });

      // 名前
      row.appendChild(div({fontWeight:'700',fontSize:'13px',color,minWidth:'52px'},[name]));

      // チェーン表示
      const chain=div({display:'flex',alignItems:'center',gap:'4px',flex:'1',flexWrap:'wrap'});
      const prevChip=div({
        background:color+'22',color,border:'1px solid '+color,
        borderRadius:'6px',padding:'3px 8px',fontSize:'11px',fontWeight:'600',
      },[prevM+'月末 '+prevConsec+'日']);
      const arrow=div({fontSize:'14px',color:C.muted},['→']);
      const currChip=div({
        background:color+'22',color,border:'1px solid '+color,
        borderRadius:'6px',padding:'3px 8px',fontSize:'11px',fontWeight:'600',
      },[state.month+'月頭 '+currConsec+'日']);
      chain.appendChild(prevChip);chain.appendChild(arrow);chain.appendChild(currChip);
      row.appendChild(chain);

      // 合計・警告
      const totalDiv=div({
        fontWeight:'700',fontSize:'13px',
        color:isWarn?'#dc2626':color,
        flexShrink:'0',
      },[isWarn?'⚠ ':'','計'+total+'日']);
      row.appendChild(totalDiv);
      colSec.appendChild(row);
    });
    section.appendChild(colSec);
  });

  if(!hasAny){
    section.appendChild(div({
      fontSize:'13px',color:C.muted,textAlign:'center',padding:'12px 0',
    },['月またぎの連続担当はありません ✅']));
  }

  return section;
}

// 📊 担当回数の偏り表示
// ============================================================
function buildDutyBalanceChart(ds){
  const mm=mainMembers();
  if(!mm.length)return div({});

  // 各メンバーの担当回数を集計
  const counts={};
  mm.forEach(m=>{counts[m.name]=0;});
  ds.forEach(d=>{
    const dstr=toDS(d);
    DUTY_COLS.forEach(dc=>{
      getDutyNames(dstr,dc.key).forEach(n=>{if(counts[n]!==undefined)counts[n]++;});
    });
  });

  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return div({});
  const maxCount=Math.max(...entries.map(([,v])=>v),1);
  const totalCount=entries.reduce((s,[,v])=>s+v,0);
  const avg=mm.length>0?totalCount/mm.length:0;

  const section=div({background:'#fff',border:'1px solid '+C.border,borderRadius:'14px',padding:'14px',marginBottom:'20px'});
  const hdr=div({display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'});
  hdr.appendChild(div({fontWeight:'700',fontSize:'14px',color:'#1e293b'},['担当回数の偏り']));
  hdr.appendChild(div({fontSize:'11px',color:C.muted},['平均 '+avg.toFixed(1)+'回']));
  section.appendChild(hdr);

  entries.forEach(([name,count])=>{
    const ratio=count/maxCount;
    const diff=count-avg;
    const barColor=diff>1.5?'#e88fa8':diff<-1.5?'#7fb3d3':'#6abf99';
    const row=div({marginBottom:'10px'});
    const labelRow=div({display:'flex',justifyContent:'space-between',marginBottom:'4px',alignItems:'center'});
    labelRow.appendChild(div({fontSize:'12px',fontWeight:'600',color:C.text},[name]));
    const countDiv=div({display:'flex',alignItems:'center',gap:'6px'});
    countDiv.appendChild(div({fontSize:'13px',fontWeight:'700',color:barColor},[count+'回']));
    if(Math.abs(diff)>0.5){
      countDiv.appendChild(div({fontSize:'10px',color:barColor,background:barColor+'22',borderRadius:'4px',padding:'1px 5px',fontWeight:'700'},[diff>0?'+'+diff.toFixed(1):diff.toFixed(1)]));
    }
    labelRow.appendChild(countDiv);
    row.appendChild(labelRow);
    const barBg=div({background:'#f0f0f0',borderRadius:'4px',height:'8px',overflow:'hidden'});
    const bar=div({background:barColor,borderRadius:'4px',height:'8px',width:(ratio*100)+'%',transition:'width 0.4s ease'});
    barBg.appendChild(bar);row.appendChild(barBg);
    section.appendChild(row);
  });

  // 凡例
  const legend=div({display:'flex',gap:'12px',marginTop:'12px',flexWrap:'wrap'});
  [{color:'#e88fa8',label:'多い(+1.5以上)'},{color:'#6abf99',label:'均等'},{color:'#7fb3d3',label:'少ない(-1.5以下)'}].forEach(({color,label})=>{
    const l=div({display:'flex',alignItems:'center',gap:'4px',fontSize:'10px',color:C.muted});
    l.appendChild(div({width:'10px',height:'10px',borderRadius:'2px',background:color,flexShrink:'0'}));
    l.appendChild(txt(label));legend.appendChild(l);
  });
  section.appendChild(legend);
  return section;
}

  const btnRow=div({display:'flex',gap:'8px'});

  // 入れ替え実行ボタン
  const canSwap=swapDayA&&swapDayB&&swapDayA!==swapDayB;
  btnRow.appendChild(btn({

  },()=>{
    if(!canSwap)return;
    executeSwap(swapDayA,swapDayB);
  },'🔄 入れ替え実行'));

  btnRow.appendChild(btn({

  },()=>setState({swapMode:false,swapDayA:null,swapDayB:null,activeAction:'edit'}),'終了'));

}

function executeSwap(dsA,dsB){
  const d={...state.data};
  const ddA={...(d[dsA]||{})};
  const ddB={...(d[dsB]||{})};

  // 担当キー（__office__/__safe__/__clean__）のみ入れ替え
  const tmpDuties={};
  DUTY_COLS.forEach(dc=>{
    tmpDuties[dc.key]={
      a:[...(ddA[dc.key]||[])],
      b:[...(ddB[dc.key]||[])],
    };
  });

  // 担当キーを入れ替え
  DUTY_COLS.forEach(dc=>{
    ddA[dc.key]=tmpDuties[dc.key].b;
    ddB[dc.key]=tmpDuties[dc.key].a;
  });

  // メンバーの担当ステータス（事務所番・金庫番・掃除）も同期
  const DUTY_LABELS=DUTY_COLS.map(dc=>dc.label);
  state.members.forEach(({name})=>{
    // A日のメンバーステータスから担当ラベルを除去し、B日の担当に基づき再設定
    const stsA=(ddA[name]||[]).filter(s=>!DUTY_LABELS.includes(s));
    const stsB=(ddB[name]||[]).filter(s=>!DUTY_LABELS.includes(s));
    DUTY_COLS.forEach(dc=>{
      if((ddA[dc.key]||[]).includes(name))stsA.push(dc.label);
      if((ddB[dc.key]||[]).includes(name))stsB.push(dc.label);
    });
    if(stsA.length||ddA[name])ddA[name]=stsA;
    if(stsB.length||ddB[name])ddB[name]=stsB;
  });

  d[dsA]=ddA;
  d[dsB]=ddB;

  const dA=new Date(dsA),dB=new Date(dsB);
  setState({
    data:d,
    swapDayA:null,swapDayB:null,
  },true);

  // 完了通知
  const{ov,sheet}=buildSheet(()=>ov.remove());
  sheet.appendChild(div({fontWeight:'700',fontSize:'15px',color:'#2e7d5e',marginBottom:'8px'},['✅ 入れ替え完了！']));
  sheet.appendChild(div({fontSize:'13px',color:C.text,marginBottom:'16px'},[
    (dA.getMonth()+1)+'/'+dA.getDate()+'（'+dayLbl(dA)+'）と '+
    (dB.getMonth()+1)+'/'+dB.getDate()+'（'+dayLbl(dB)+'）の担当を入れ替えました。'
  ]));
  sheet.appendChild(btn({width:'100%',background:C.accent,color:'#fff',border:'none',borderRadius:'10px',padding:'14px',fontSize:'14px',fontWeight:'700',minHeight:'52px'},()=>{ov.remove();},'閉じる'));
  const appEl=document.getElementById('app');
  if(appEl)appEl.appendChild(ov);
}

function buildSummaryTab(ds){
  const wrap=div({padding:'12px 12px 40px',maxWidth:'700px',margin:'0 auto'});
  wrap.appendChild(div({fontSize:'16px',fontWeight:'700',color:'#1e293b',marginBottom:'4px'},['担当一覧サマリー']));
  wrap.appendChild(div({fontSize:'12px',color:C.muted,marginBottom:'16px'},['月の全担当をまとめて確認できます']));

  // ── ④ 月またぎ連続確認 ──
  wrap.appendChild(buildMonthBoundaryCheck());

  // ── 担当回数の偏り表示 ──
  wrap.appendChild(buildDutyBalanceChart(ds));
  DUTY_COLS.forEach(dc=>{
    const section=div({marginBottom:'20px'});
    const sh=div({background:dc.lightBg,border:'1px solid '+dc.accent,borderRadius:'10px 10px 0 0',padding:'10px 14px',display:'flex',alignItems:'center',gap:'8px'});
    sh.appendChild(div({fontWeight:'700',color:dc.accent,fontSize:'14px'},[dc.label]));
    const total=ds.filter(d=>dc.req?isReq(d):true).length;
    const set=ds.filter(d=>{if(dc.req&&!isReq(d))return false;return getDutyNames(toDS(d),dc.key).length>0;}).length;
    sh.appendChild(div({fontSize:'12px',color:dc.accent,marginLeft:'auto'},[set+'/'+total+'日設定済み'+(set<total?' ⚠':'  ✅')]));
    section.appendChild(sh);
    const body=div({background:'#fff',border:'1px solid '+dc.accent,borderTop:'none',borderRadius:'0 0 10px 10px',padding:'10px 14px'});
    const byMember={};
    ds.forEach(d=>{if(dc.req&&!isReq(d))return;getDutyNames(toDS(d),dc.key).forEach(n=>{if(!byMember[n])byMember[n]=[];byMember[n].push(d);});});
    const entries=Object.entries(byMember).sort((a,b)=>b[1].length-a[1].length);
    if(!entries.length)body.appendChild(div({fontSize:'13px',color:C.muted,textAlign:'center',padding:'8px 0'},['担当者未設定']));
    else entries.forEach(([name,memberDays])=>{
      const row=div({display:'flex',gap:'8px',alignItems:'flex-start',marginBottom:'10px',paddingBottom:'10px',borderBottom:'1px solid '+C.border});
      const nb=div({flexShrink:'0',width:'52px',background:dc.lightBg,color:dc.accent,borderRadius:'8px',padding:'6px 4px',textAlign:'center',fontWeight:'700',fontSize:'12px'});
      nb.appendChild(txt(name));nb.appendChild(div({fontSize:'10px',color:dc.accent,opacity:'0.8',marginTop:'2px'},[memberDays.length+'日']));row.appendChild(nb);
      const chips=div({display:'flex',flexWrap:'wrap',gap:'4px',flex:'1'});
      memberDays.forEach(d=>{const wkEnd=isWk(d)||isHol(d);const chip=div({background:wkEnd?C.wkBg:'#f8f8f8',border:'1px solid '+(wkEnd?dc.accent:C.border),borderRadius:'6px',padding:'4px 7px',fontSize:'12px',fontWeight:wkEnd?'700':'400',color:wkEnd?dc.accent:C.text,whiteSpace:'nowrap'});chip.appendChild(txt((d.getMonth()+1)+'/'+d.getDate()+'('+dayLbl(d)+')'));chips.appendChild(chip);});
      row.appendChild(chips);body.appendChild(row);
    });
    const unsetDays=ds.filter(d=>{if(dc.req&&!isReq(d))return false;return getDutyNames(toDS(d),dc.key).length===0;});
    if(unsetDays.length>0){const ur=div({display:'flex',gap:'4px',flexWrap:'wrap',marginTop:'4px',padding:'8px',background:C.warnBg,borderRadius:'8px'});ur.appendChild(div({fontSize:'12px',color:C.warnText,fontWeight:'700',width:'100%',marginBottom:'4px'},['⚠ 未設定 '+unsetDays.length+'日']));unsetDays.forEach(d=>{const chip=div({background:'#fff',border:'1px solid '+C.warnBorder,borderRadius:'6px',padding:'4px 7px',fontSize:'12px',color:C.warnText,whiteSpace:'nowrap'});chip.appendChild(txt((d.getMonth()+1)+'/'+d.getDate()+'('+dayLbl(d)+')'));ur.appendChild(chip);});body.appendChild(ur);}
    section.appendChild(body);wrap.appendChild(section);
  });
  const absSection=div({marginBottom:'20px'});
  absSection.appendChild(div({fontFamily:'Georgia,serif',fontSize:'14px',fontWeight:'700',color:C.subCat,marginBottom:'10px'},['🏖 休暇・半休 集計']));
  const absGrid=div({display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'});
  state.members.forEach(m=>{
    const card=div({background:'#fff',border:'1px solid '+C.border,borderRadius:'10px',padding:'12px'});
    const mhdr=div({display:'flex',alignItems:'center',gap:'6px',marginBottom:'8px'});
    mhdr.appendChild(div({fontWeight:'700',color:C.text,fontSize:'13px'},[m.name]));
    mhdr.appendChild(div({fontSize:'10px',color:m.category==='main'?C.mainCat:C.subCat,background:m.category==='main'?C.mainBg:C.subBg,borderRadius:'4px',padding:'2px 6px'},[m.category==='main'?'メイン':'サブ']));
    card.appendChild(mhdr);let hasAny=false;
    ['公休','有休','午前半休','午後半休'].forEach(st=>{const cnt=ds.filter(d=>getStatuses(toDS(d),m.name).includes(st)).length;if(cnt>0){hasAny=true;const ss=STATUS_STYLE[st];const row=div({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'});row.appendChild(span({background:ss.bg,color:ss.text,border:'1px solid '+ss.border,borderRadius:'4px',padding:'2px 6px',fontSize:'11px',fontWeight:'600'},st));row.appendChild(div({fontSize:'12px',fontWeight:'700',color:ss.text},[cnt+'日']));card.appendChild(row);}});
    if(!hasAny)card.appendChild(div({fontSize:'12px',color:C.muted},['休暇なし']));
    absGrid.appendChild(card);
  });
  absSection.appendChild(absGrid);wrap.appendChild(absSection);return wrap;
}

// 起動
// ============================================================
// 過去3ヶ月より古いデータを削除する
function pruneOldData(data){
  const cutoff=new Date();
  cutoff.setDate(cutoff.getDate()-90); // 90日前
  const cutoffDS=cutoff.toISOString().slice(0,10);
  let pruned=false;
  Object.keys(data).forEach(ds=>{
    if(ds<cutoffDS){
      delete data[ds];
      pruned=true;
    }
  });
  return{data,pruned};
}

function initApp(loaded){
  const raw=loaded.shiftData||{};

  // 起動時に古いデータを自動削除
  const{data,pruned}=pruneOldData(raw);

  // 既存データから「責任者」を削除
  let cleanedResp=false;
  Object.keys(data).forEach(ds=>{
    const dd=data[ds];if(!dd)return;
    Object.keys(dd).forEach(k=>{
      const v=dd[k];
      if(Array.isArray(v)&&v.includes('責任者')){dd[k]=v.filter(s=>s!=='責任者');cleanedResp=true;}
      else if(v==='責任者'){dd[k]=[];cleanedResp=true;}
    });
  });
  state.data=data;

  if(Array.isArray(loaded.members)&&loaded.members.length>0){
    state.members=ensureMemberColors(loaded.members);
    state.nextId=state.members.length>0?Math.max(...state.members.map(m=>m.id||0))+1:11;
  }
  document.getElementById('loading').style.display='none';
  document.getElementById('setup').classList.remove('show');
  document.getElementById('app').style.display='block';

  // 削除があった場合は自動保存
  if(pruned||cleanedResp)scheduleSave();

  render();

  // 起動時：シフト表の「本日」行が最初から見える位置までスクロール
  requestAnimationFrame(()=>{
    const row=document.querySelector('[data-today-row="1"]');
    if(row)row.scrollIntoView({block:'center'});
  });
}

(async()=>{
  if(GAS_URL){
    document.getElementById('loading-msg').textContent='データを読み込み中...';
    try{
      const data=await gasLoad();
      initApp(data);
    }catch(e){
      // GAS接続失敗→ローカルデータで起動
      const sd=localStorage.getItem(LS_DATA);
      const sm=localStorage.getItem(LS_MEM);
      initApp({shiftData:sd?JSON.parse(sd):{},members:sm?JSON.parse(sm):null});
      setTimeout(()=>setSaveStatus('error'),500);
    }
  }else{
    const sd=localStorage.getItem(LS_DATA);
    const sm=localStorage.getItem(LS_MEM);
    if(sd||sm){
      // ローカルデータあり→直接起動
      initApp({shiftData:sd?JSON.parse(sd):{},members:sm?JSON.parse(sm):null});
    }else{
      // 初回→URL設定画面
      document.getElementById('loading').style.display='none';
      document.getElementById('setup').classList.add('show');
    }
  }
})();
</script>
